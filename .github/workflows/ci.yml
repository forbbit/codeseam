name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check src tests
      - name: Run pytest
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest 2>&1 | tee pytest.log
      - name: Report pytest failure
        if: steps.pytest.outcome == 'failure'
        shell: bash
        run: |
          summary="$(tail -n 80 pytest.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          echo "::error title=pytest failure::${summary}"
          exit 1
      - run: uv build
