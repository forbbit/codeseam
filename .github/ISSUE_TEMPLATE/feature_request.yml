name: Feature request
description: Propose a focused improvement or language frontend.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What script-refactoring workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Show the desired command, input, and output when possible.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Constraints and tradeoffs
      description: Note language semantics, safety risks, or compatibility requirements.
