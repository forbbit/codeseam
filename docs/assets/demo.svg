<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">CodeSeam command-line demonstration</title>
  <desc id="desc">A MATLAB script enters CodeSeam, which recommends a function boundary after signal normalization and explains the boundary score.</desc>
  <rect width="1120" height="500" rx="18" fill="#0d1117"/>
  <rect x="30" y="30" width="1060" height="440" rx="12" fill="#161b22" stroke="#30363d"/>
  <circle cx="58" cy="56" r="7" fill="#ff7b72"/>
  <circle cx="82" cy="56" r="7" fill="#d29922"/>
  <circle cx="106" cy="56" r="7" fill="#3fb950"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">
    <text x="55" y="105" fill="#8b949e">$</text>
    <text x="78" y="105" fill="#e6edf3">codeseam analyze examples/energy_pipeline.m</text>
    <text x="55" y="150" fill="#79c0ff">MATLAB script</text>
    <text x="55" y="182" fill="#8b949e">1</text><text x="90" y="182" fill="#e6edf3">raw = randn(1, 256);</text>
    <text x="55" y="214" fill="#8b949e">3</text><text x="90" y="214" fill="#ff7b72">if</text><text x="115" y="214" fill="#e6edf3"> mean(raw) &gt; cutoff</text>
    <text x="55" y="246" fill="#8b949e">...</text><text x="90" y="246" fill="#e6edf3">    prepared = detrend(raw);</text>
    <text x="55" y="278" fill="#8b949e">8</text><text x="90" y="278" fill="#e6edf3">scale = max(abs(prepared));</text>
    <text x="55" y="310" fill="#8b949e">9</text><text x="90" y="310" fill="#e6edf3">normalized = prepared / max(scale, eps);</text>
    <line x1="55" y1="334" x2="565" y2="334" stroke="#3fb950" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="55" y="363" fill="#3fb950">        recommended function boundary</text>
    <text x="55" y="400" fill="#8b949e">10</text><text x="90" y="400" fill="#e6edf3">spectrum = abs(fft(normalized));</text>
    <text x="55" y="432" fill="#8b949e">...</text>
    <line x1="610" y1="128" x2="610" y2="432" stroke="#30363d"/>
    <text x="650" y="160" fill="#79c0ff">Recommended boundary</text>
    <text x="650" y="205" fill="#e6edf3">after line 9</text>
    <text x="650" y="242" fill="#e6edf3">score</text><text x="830" y="242" fill="#3fb950">0.754</text>
    <text x="650" y="279" fill="#e6edf3">prominence</text><text x="830" y="279" fill="#3fb950">0.106</text>
    <text x="650" y="316" fill="#e6edf3">constraints</text><text x="830" y="316" fill="#3fb950">none</text>
    <text x="650" y="353" fill="#e6edf3">crossing data</text><text x="830" y="353" fill="#d2a8ff">normalized</text>
    <text x="650" y="405" fill="#8b949e">No MATLAB runtime. No comments used.</text>
  </g>
</svg>
