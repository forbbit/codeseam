[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeseam"
version = "0.1.0"
description = "Deterministic, explainable MATLAB script boundary analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["matlab", "static-analysis", "program-dependence-graph", "refactoring"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-matlab>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
codeseam = "codeseam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeseam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
